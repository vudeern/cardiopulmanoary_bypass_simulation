[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfusion-sentinel"
version = "1.7.0"
description = "An inspectable cardiopulmonary bypass fault-injection and counterfactual simulation laboratory"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Udeern Varanasi"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
perfusion-lab = "perfusion_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

