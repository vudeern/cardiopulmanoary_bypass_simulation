name: Horizon numerical diagnostic
on:
  push:
    branches: [development/horizon-foundation]
    paths: [.github/workflows/horizon-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.probe.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e ".[audit,horizon]"
      - id: probe
        shell: python
        run: |
          import os,sys,unittest,io
          import numpy as np
          sys.path.insert(0,'src')
          from perfusion_research.horizon import formulate,HorizonSolver
          p=formulate([1.4,1.,14.],1.,np.ones(8),np.full(8,60.),np.full(8,100.))
          import osqp
          from scipy import sparse
          from perfusion_research.horizon import validate_plan
          scale=np.r_[np.tile([1.,7.,95.],p.steps+1),np.full(p.steps,7.),np.full(p.horizon,280.)]
          AS=p.A@sparse.diags(scale)
          norms=np.asarray(abs(AS).max(axis=1).toarray()).ravel()
          inv=1./np.maximum(norms,1e-12)
          A=(sparse.diags(inv)@AS).tocsc();q=p.cost*scale;q=q/max(abs(q))
          records=[]
          for eps in (1e-8,1e-7,1e-6):
              solver=osqp.OSQP();solver.setup(P=sparse.csc_matrix((len(q),len(q))),q=q,A=A,l=p.lower*inv,u=p.upper*inv,verbose=False,eps_abs=eps,eps_rel=eps,max_iter=100000,polishing=True,time_limit=5.)
              r=solver.solve(raise_error=False)
              c=validate_plan(p,r.x*scale) if r.info.status_val==1 else {}
              records.append(str(eps)+':'+r.info.status+':'+str(c.get('valid'))+':'+format(c.get('rollout_error',-1),'.3g'))
          text=' | '.join(records)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('result='+text[:250]+'\n')
  report:
    needs: probe
    name: ${{ needs.probe.outputs.result }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Numerical diagnostic complete"
