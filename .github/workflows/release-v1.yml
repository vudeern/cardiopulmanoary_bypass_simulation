name: Package complete final v1
on:
  push:
    branches: [development/final-v1]
  workflow_run:
    workflows: ['Verify simulation']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: complete-final-v1-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.repository == 'vudeern/cardiopulmanoary_bypass_simulation') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: eligible
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import re
          v=re.search(r'^version\s*=\s*"([^"]+)"',Path('pyproject.toml').read_text(),re.M).group(1)
          print('eligible='+str(v=='1.15.0').lower())
          PY
      - if: steps.eligible.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python examples/await_source_ci.py
      - if: steps.eligible.outputs.eligible == 'true'
        run: python -m pip install -e ".[audit,horizon]" setuptools wheel
      - id: existing
        if: steps.eligible.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/v1-release-list.json
          python - <<'PYEXIST' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('/tmp/v1-release-list.json'))
          print('exists='+str(any(r['tag_name']=='v1.15.0' for r in data)).lower())
          PYEXIST
      - if: steps.eligible.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        run: |
          python examples/check_versions.py
          python examples/fixed_ceiling_bound.py --check
          python examples/package_current_v1.py ../release-assets
          python -m venv --system-site-packages ../wheel-test
          ../wheel-test/bin/python -m pip install --no-deps --force-reinstall ../release-assets/*.whl
          ../wheel-test/bin/perfusion-lab run --scenario compound --duration 20 --dt 1 --out /tmp/final-v1-wheel-smoke
      - if: steps.eligible.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            python examples/publish_current_v1.py --finalize-existing
          else
            python examples/publish_current_v1.py ../release-assets
          fi
