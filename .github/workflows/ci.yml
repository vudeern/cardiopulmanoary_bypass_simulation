name: Verify simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[audit,horizon]"
      - run: python -m unittest discover -s tests -v
      - run: perfusion-lab run --scenario compound --out /tmp/perfusion-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/web_contract.cjs
      - run: python examples/validate_artifacts.py

      - run: python examples/validate_level_guard.py
      - run: python examples/validate_conservative_study.py
      - run: python examples/validate_robustness_study.py
      - run: python examples/validate_reference_study.py
      - run: python examples/validate_submission_study.py
      - run: python examples/published_patient_replay.py --check
      - run: python examples/validate_controller_comparison.py
      - run: python examples/verify_simc.py --check
      - run: python examples/validate_simc_benchmark.py
      - run: python examples/build_simc_web.py --check
      - run: python examples/validate_simc_tight.py
      - run: python examples/validate_braking_study.py
      - run: python examples/build_braking_web.py --check
      - run: python examples/validate_continuity_study.py
      - run: python examples/build_continuity_web.py --check
      - run: python examples/continuity_reference_check.py --check
      - run: python examples/diagnose_continuity.py --check
      - run: python examples/validate_selective_study.py
      - run: python examples/build_selective_web.py --check
      - run: python examples/selective_capacity.py --check
      - run: python examples/validate_integrity_study.py
      - run: python examples/build_integrity_web.py --check
      - run: python examples/validate_slowdown_audit.py
      - run: python examples/build_slowdown_web.py --check
      - run: python examples/validate_model_bank_study.py
      - run: python examples/build_model_bank_web.py --check
      - run: python examples/check_versions.py
      - run: python examples/validate_runtime.py --check
      - run: python examples/validate_reachability_study.py
      - run: python examples/validate_reachability_base.py
      - run: python examples/build_reachability_risk.py --check
      - run: python examples/build_reachability_web.py --check
      - run: python examples/validate_depletion_study.py --replay
      - run: python examples/build_depletion_web.py --check
      - run: python examples/validate_finite_return.py --replay
      - run: python examples/build_finite_return_web.py --check
      - run: python examples/validate_startup.py --replay
      - run: python examples/validate_calibrated_pump.py --replay
      - run: python examples/build_startup_web.py --check
      - run: python examples/validate_identifiability.py
      - run: python examples/validate_horizon.py
      - run: python examples/validate_feedback.py
      - run: python examples/fixed_ceiling_bound.py --check
      - run: python examples/validate_recovery_v2.py
      - run: python examples/validate_joint_v2.py
