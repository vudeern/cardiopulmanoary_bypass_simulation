name: Verify simulation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: perfusion-lab run --scenario compound --out /tmp/perfusion-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/web_contract.cjs
      - run: python examples/validate_artifacts.py

      - run: python examples/validate_level_guard.py
      - run: python examples/validate_conservative_study.py
      - run: python examples/validate_robustness_study.py
